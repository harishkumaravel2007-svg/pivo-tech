<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none">
  <!-- PIVO TECH Official Logo - Light Background Edition -->
  <defs>
    <linearGradient id="llGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#9E7D3B"/>
    </linearGradient>
    <linearGradient id="llNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162340"/>
      <stop offset="100%" stop-color="#101B33"/>
    </linearGradient>
  </defs>

  <!-- Geometric Symbol -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#llNavyGrad)" stroke="#C6A15B" stroke-width="1.5" stroke-opacity="0.35"/>
    <rect x="13" y="12" width="5.5" height="24" rx="2.5" fill="#FFFFFF"/>
    <path d="M18.5 12H27C31.4183 12 35 15.5817 35 20C35 24.4183 31.4183 28 27 28H18.5V22.5H26.5C27.8807 22.5 29 21.3807 29 20C29 18.6193 27.8807 17.5 26.5 17.5H18.5V12Z" fill="url(#llGoldGrad)"/>
    <circle cx="23.5" cy="20" r="2.2" fill="#FFFFFF"/>
    <path d="M13 28.5L18.5 34V28.5H13Z" fill="url(#llGoldGrad)" opacity="0.9"/>
  </g>

  <!-- PIVO Wordmark in Deep Navy -->
  <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#101B33">PIVO</text>

  <!-- TECH Wordmark in Gold -->
  <text x="136" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="url(#llGoldGrad)">TECH</text>

  <!-- Tagline underneath in Slate -->
  <text x="63" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.8" fill="#4B5563">BUILD. GROW. AUTOMATE.</text>
