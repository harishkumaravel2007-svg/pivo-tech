<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="voiceBg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#121D38" />
    </linearGradient>
    <radialGradient id="voiceOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#0C1426" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="520" rx="16" fill="url(#voiceBg)" />
  
  <rect width="100%" height="40" fill="#0C1426" rx="16" />
  <circle cx="24" cy="20" r="5" fill="#FF5F56" />
  <circle cx="40" cy="20" r="5" fill="#FFBD2E" />
  <circle cx="56" cy="20" r="5" fill="#27C93F" />
  <rect x="80" y="10" width="400" height="20" rx="6" fill="#152342" />
  <text x="280" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">PIVO TECH Natural Voice Agent Telephony & Speech Synthesis Gateway</text>
  <circle cx="760" cy="20" r="3" fill="#C6A15B" />


  <g transform="translate(250, 60)">
    <!-- Smartphone Chassis -->
    <rect width="300" height="425" rx="36" fill="#1E293B" stroke="#475569" stroke-width="3" />
    <rect x="10" y="10" width="280" height="405" rx="28" fill="#0A0F1D" />

    <!-- Speaker & Camera -->
    <rect x="110" y="20" width="80" height="8" rx="4" fill="#1E293B" />
    <circle cx="170" cy="24" r="3" fill="#334155" />

    <!-- Caller Meta -->
    <text x="150" y="65" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">ACTIVE INBOUND VOICE CALL</text>
    <text x="150" y="88" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PIVO TECH Voice Agent</text>
    <text x="150" y="105" fill="#C6A15B" font-family="sans-serif" font-size="12" text-anchor="middle">01:48 • Ultra-low Latency (240ms)</text>

    <!-- Glowing Voice Orb -->
    <circle cx="150" cy="180" r="70" fill="url(#voiceOrb)" opacity="0.8" />
    <circle cx="150" cy="180" r="45" fill="#101B33" stroke="#C6A15B" stroke-width="2" />
    <path d="M 142 165 C 142 160 158 160 158 165 L 158 185 C 158 190 142 190 142 185 Z" fill="#E5C378" />
    <path d="M 134 175 C 134 195 166 195 166 175" stroke="#E5C378" stroke-width="2" fill="none" />
    <line x1="150" y1="195" x2="150" y2="205" stroke="#E5C378" stroke-width="2" />

    <!-- Audio Wave Spectrum -->
    <g transform="translate(50, 265)">
      <rect x="0" y="12" width="4" height="16" rx="2" fill="#C6A15B" />
      <rect x="10" y="6" width="4" height="28" rx="2" fill="#E5C378" />
      <rect x="20" y="2" width="4" height="36" rx="2" fill="#C6A15B" />
      <rect x="30" y="8" width="4" height="24" rx="2" fill="#E5C378" />
      <rect x="40" y="0" width="4" height="40" rx="2" fill="#38BDF8" />
      <rect x="50" y="10" width="4" height="20" rx="2" fill="#C6A15B" />
      <rect x="60" y="4" width="4" height="32" rx="2" fill="#E5C378" />
      <rect x="70" y="14" width="4" height="12" rx="2" fill="#C6A15B" />
      <rect x="80" y="2" width="4" height="36" rx="2" fill="#38BDF8" />
      <rect x="90" y="8" width="4" height="24" rx="2" fill="#E5C378" />
      <rect x="100" y="0" width="4" height="40" rx="2" fill="#C6A15B" />
      <rect x="110" y="12" width="4" height="16" rx="2" fill="#E5C378" />
      <rect x="120" y="4" width="4" height="32" rx="2" fill="#C6A15B" />
      <rect x="130" y="8" width="4" height="24" rx="2" fill="#38BDF8" />
      <rect x="140" y="2" width="4" height="36" rx="2" fill="#E5C378" />
      <rect x="150" y="10" width="4" height="20" rx="2" fill="#C6A15B" />
      <rect x="160" y="6" width="4" height="28" rx="2" fill="#E5C378" />
      <rect x="170" y="12" width="4" height="16" rx="2" fill="#C6A15B" />
      <rect x="180" y="4" width="4" height="32" rx="2" fill="#38BDF8" />
      <rect x="190" y="14" width="4" height="12" rx="2" fill="#C6A15B" />
    </g>

    <!-- Real-time Speech Transcript Bubble -->
    <g transform="translate(20, 320)">
      <rect width="260" height="50" rx="10" fill="#152342" stroke="#253556" stroke-width="1" />
      <text x="12" y="20" fill="#C6A15B" font-family="sans-serif" font-size="10" font-weight="bold">Transcribing Live Speech:</text>
      <text x="12" y="38" fill="#F8FAFC" font-family="sans-serif" font-size="11">"Yes, I can schedule a call with Harish K..."</text>
    </g>

    <!-- End Call Button -->
    <circle cx="150" cy="390" r="16" fill="#EF4444" />
    <path d="M 142 393 C 144 387 156 387 158 393" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Left Callout Box -->
  <g transform="translate(40, 150)">
    <rect width="180" height="120" rx="12" fill="#152342" stroke="#253556" stroke-width="1" />
    <text x="16" y="28" fill="#C6A15B" font-family="sans-serif" font-size="11" font-weight="bold">VOICE SPECS</text>
    <text x="16" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Natural Neural Voice</text>
    <text x="16" y="70" fill="#94A3B8" font-family="sans-serif" font-size="10">• Multiple Indian accents</text>
    <text x="16" y="86" fill="#94A3B8" font-family="sans-serif" font-size="10">• Sub-second latency</text>
    <text x="16" y="102" fill="#94A3B8" font-family="sans-serif" font-size="10">• WhatsApp &amp; SIP trunking</text>
  </g>

  <!-- Right Callout Box -->
  <g transform="translate(580, 150)">
    <rect width="180" height="120" rx="12" fill="#152342" stroke="#253556" stroke-width="1" />
    <text x="16" y="28" fill="#22C55E" font-family="sans-serif" font-size="11" font-weight="bold">BUSINESS USE-CASES</text>
    <text x="16" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Lead Qualification</text>
    <text x="16" y="70" fill="#94A3B8" font-family="sans-serif" font-size="10">• Booking appointments</text>
    <text x="16" y="86" fill="#94A3B8" font-family="sans-serif" font-size="10">• Customer follow-ups</text>
    <text x="16" y="102" fill="#94A3B8" font-family="sans-serif" font-size="10">• Outbound confirmation</text>
  </g>
</svg>