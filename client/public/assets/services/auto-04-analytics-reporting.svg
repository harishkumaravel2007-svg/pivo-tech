      <text x="12" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Weekly Executive Summary</text>
      <text x="12" y="32" fill="#C6A15B" font-family="sans-serif" font-size="9">Every Monday 8:00 AM • PDF / Email</text>
    </g>

    <g transform="translate(480, 115)">
      <rect width="220" height="42" rx="8" fill="#1A2846" />
      <text x="12" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Daily WhatsApp KPI Ticker</text>
      <text x="12" y="32" fill="#22C55E" font-family="sans-serif" font-size="9">Daily 9:00 PM • WhatsApp Direct</text>
