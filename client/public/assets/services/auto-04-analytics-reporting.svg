    <text x="18" y="62" fill="#C6A15B" font-family="sans-serif" font-size="28" font-weight="bold">184 hrs</text>
    <text x="18" y="84" fill="#22C55E" font-family="sans-serif" font-size="10">Equal to 1.2 Full-Time Staff</text>

    <rect x="248" y="0" width="225" height="100" rx="12" fill="#152342" stroke="#253556" stroke-width="1" />
    <text x="266" y="28" fill="#94A3B8" font-family="sans-serif" font-size="11">Process Accuracy</text>
    <text x="266" y="62" fill="#38BDF8" font-family="sans-serif" font-size="28" font-weight="bold">99.98%</text>
    <text x="266" y="84" fill="#94A3B8" font-family="sans-serif" font-size="10">Zero human data entry typos</text>

    <rect x="495" y="0" width="225" height="100" rx="12" fill="#152342" stroke="#253556" stroke-width="1" />
    <text x="513" y="28" fill="#94A3B8" font-family="sans-serif" font-size="11">Lead Conversion Lift</text>
    <text x="513" y="62" fill="#22C55E" font-family="sans-serif" font-size="28" font-weight="bold">+42%</text>
    <text x="513" y="84" fill="#22C55E" font-family="sans-serif" font-size="10">Via &lt; 60s reply automation</text>
  </g>

