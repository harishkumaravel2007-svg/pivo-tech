    <text x="0" y="40" fill="#94A3B8" font-family="sans-serif" font-size="11">Scheduled executive briefings delivered weekly to your inbox and WhatsApp.</text>
  </g>

  <!-- Big Metrics Row -->
  <g transform="translate(40, 120)">
