    <g transform="translate(480, 165)">
      <rect width="220" height="42" rx="8" fill="#1A2846" />
      <text x="12" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Monthly Client Retention Audit</text>
      <text x="12" y="32" fill="#38BDF8" font-family="sans-serif" font-size="9">1st of Month • Excel &amp; Webhook</text>
