<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="repBg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090E1D" />
      <stop offset="100%" stop-color="#101B33" />
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="16" fill="url(#repBg)" />
  
  <rect width="100%" height="40" fill="#0C1426" rx="16" />
  <circle cx="24" cy="20" r="5" fill="#FF5F56" />
  <circle cx="40" cy="20" r="5" fill="#FFBD2E" />
  <circle cx="56" cy="20" r="5" fill="#27C93F" />
  <rect x="80" y="10" width="400" height="20" rx="6" fill="#152342" />
  <text x="280" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">PIVO TECH Automated Business Analytics & KPI Reporting Suite</text>
  <circle cx="760" cy="20" r="3" fill="#C6A15B" />


  <!-- Header -->
  <g transform="translate(40, 60)">
