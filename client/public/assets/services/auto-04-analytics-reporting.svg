    <rect x="90" y="120" width="30" height="80" rx="4" fill="#334155" />
    <rect x="140" y="100" width="30" height="100" rx="4" fill="#C6A15B" fill-opacity="0.4" />
    <rect x="190" y="80" width="30" height="120" rx="4" fill="#C6A15B" fill-opacity="0.7" />
    <rect x="240" y="60" width="30" height="140" rx="4" fill="#C6A15B" />
    <rect x="290" y="45" width="30" height="155" rx="4" fill="#E5C378" />
    <rect x="340" y="35" width="30" height="165" rx="4" fill="#22C55E" />

    <text x="55" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">M1</text>
    <text x="105" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">M2</text>
    <text x="155" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">M3</text>
    <text x="205" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">M4</text>
    <text x="255" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">M5</text>
    <text x="305" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">M6</text>
    <text x="355" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Now</text>

    <!-- Side Box: Automated Export Settings -->
    <rect x="460" y="0" width="260" height="235" rx="12" fill="#131F38" stroke="#253556" stroke-width="1" />
    <text x="480" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Scheduled Auto-Digest</text>
    <text x="480" y="48" fill="#94A3B8" font-family="sans-serif" font-size="10">Configured Reports &amp; Delivery</text>

    <g transform="translate(480, 65)">
