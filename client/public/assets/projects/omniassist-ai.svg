<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="oBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#141E33"/>
    </linearGradient>
    <linearGradient id="oGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#oBg)"/>

  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="12" fill="#111B30" stroke="#25355B" stroke-width="1.5"/>
    <rect width="680" height="40" rx="12" fill="#090E1A"/>
    <circle cx="25" cy="20" r="5" fill="#EF4444"/>
    <circle cx="45" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="65" cy="20" r="5" fill="#10B981"/>
    <rect x="90" y="10" width="280" height="20" rx="6" fill="#1B2844"/>
    <text x="105" y="24" fill="#64748B" font-family="monospace" font-size="10">https://omniassist.ai.internal</text>

    <!-- Chat Interface Mockup -->
    <!-- Left Sidebar -->
    <rect x="20" y="55" width="180" height="325" rx="8" fill="#0C1527"/>
    <rect x="35" y="70" width="120" height="16" rx="4" fill="url(#oGold)"/>
    <rect x="35" y="105" width="150" height="26" rx="6" fill="#1A2744"/>
    <rect x="35" y="140" width="150" height="26" rx="6" fill="#131F37"/>
    <rect x="35" y="175" width="150" height="26" rx="6" fill="#131F37"/>

    <!-- Main Chat Feed -->
    <rect x="215" y="55" width="445" height="325" rx="8" fill="#15213A"/>
    
    <!-- User Bubble -->
    <g transform="translate(370, 75)">
      <rect width="270" height="46" rx="12" fill="#2563EB"/>
      <rect x="15" y="12" width="220" height="10" rx="3" fill="#FFFFFF"/>
      <rect x="15" y="26" width="140" height="8" rx="2" fill="#DBEAFE"/>
    </g>

    <!-- AI Bot Bubble -->
    <g transform="translate(230, 135)">
      <rect width="360" height="90" rx="12" fill="#1C2C4E" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="25" cy="25" r="12" fill="url(#oGold)"/>
      <rect x="48" y="18" width="180" height="12" rx="3" fill="#FFFFFF"/>
      <rect x="48" y="38" width="280" height="9" rx="2" fill="#94A3B8"/>
      <rect x="48" y="52" width="260" height="9" rx="2" fill="#94A3B8"/>
      <rect x="48" y="66" width="200" height="9" rx="2" fill="#94A3B8"/>
    </g>

    <!-- Workflow Execution Card -->
    <g transform="translate(230, 240)">
      <rect width="410" height="60" rx="8" fill="#10192C" stroke="#25355B" stroke-width="1"/>
      <circle cx="30" cy="30" r="10" fill="#10B981"/>
      <rect x="52" y="18" width="180" height="11" rx="3" fill="#E2E8F0"/>
      <rect x="52" y="34" width="220" height="8" rx="2" fill="#64748B"/>
      <rect x="310" y="20" width="85" height="20" rx="4" fill="#1E2F54" stroke="url(#oGold)" stroke-width="1"/>
    </g>

    <!-- Input Bar -->
    <g transform="translate(230, 318)">
      <rect width="410" height="44" rx="8" fill="#0C1424" stroke="#25355B" stroke-width="1"/>
      <rect x="15" y="16" width="200" height="12" rx="3" fill="#475569"/>
      <rect x="350" y="10" width="50" height="24" rx="6" fill="url(#oGold)"/>
    </g>
  </g>

  <!-- Concept Demo Ribbon -->
  <g transform="translate(620, 20)">
    <rect width="150" height="26" rx="6" fill="#101B33" stroke="url(#oGold)" stroke-width="1"/>
    <text x="75" y="17" fill="#E5C378" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">CONCEPT DEMO</text>
  </g>
</svg>
