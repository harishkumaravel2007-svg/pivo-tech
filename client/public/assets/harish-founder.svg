<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Harish K - Founder & CEO Executive Badge -->
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182747"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#8C6E2E"/>
    </linearGradient>
    <linearGradient id="accentSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24375F"/>
      <stop offset="100%" stop-color="#121D33"/>
    </linearGradient>
  </defs>

  <!-- Background Base with subtle grid -->
  <rect width="400" height="400" rx="32" fill="url(#avatarBg)"/>
  
  <circle cx="200" cy="200" r="175" stroke="url(#goldRing)" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="200" cy="200" r="160" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 6"/>

  <!-- Minimalist Executive Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Shoulders / Blazer -->
    <path d="M90 340C90 280 135 240 200 240C265 240 310 280 310 340H90Z" fill="url(#accentSuit)"/>
    <!-- Collar & Tie -->
    <path d="M175 240L200 275L225 240L200 225L175 240Z" fill="#FFFFFF"/>
    <path d="M194 255L200 320L206 255Z" fill="url(#goldRing)"/>

    <!-- Head & Hair -->
    <circle cx="200" cy="165" r="54" fill="#D3A77C"/>
    <path d="M146 160C146 120 170 100 200 100C230 100 254 120 254 160C254 135 235 116 200 116C165 116 146 135 146 160Z" fill="#1A1E29"/>
    
    <!-- Modern Glasses -->
    <rect x="168" y="152" width="26" height="18" rx="4" fill="none" stroke="#1A1E29" stroke-width="3"/>
    <rect x="206" y="152" width="26" height="18" rx="4" fill="none" stroke="#1A1E29" stroke-width="3"/>
    <line x1="194" y1="160" x2="206" y2="160" stroke="#1A1E29" stroke-width="3"/>

    <!-- Confident expression -->
    <path d="M188 194C194 198 206 198 212 194" stroke="#1A1E29" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- PIVO TECH Founder Seal Badge -->
  <g transform="translate(140, 310)">
    <rect width="120" height="34" rx="17" fill="#101B33" stroke="url(#goldRing)" stroke-width="1.5"/>
    <text x="60" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E5C378" text-anchor="middle" letter-spacing="1">FOUNDER &amp; CEO</text>
  </g>
</svg>
